  <text x="67" y="38" font-size="16" letter-spacing="0" textLength="96" lengthAdjust="spacing" font-weight="700">HOW I WORK</text>
    <text x="16" y="58" font-size="10" letter-spacing="0" textLength="72" lengthAdjust="spacing" fill="#6B6B6B">ORDER TICKET</text>
    <text x="166" y="58" font-size="10" letter-spacing="0" textLength="48" lengthAdjust="spacing" fill="#6B6B6B">NO. 0042</text>
    <line x1="16" x2="214" y1="70.5" y2="70.5" stroke="#111111" stroke-width="1" stroke-dasharray="4 3.19"/>
    <text x="16" y="98" font-size="11" letter-spacing="0" textLength="52.8" lengthAdjust="spacing" font-weight="700">01 BRIEF</text>
    <text x="35.8" y="113" font-size="11" letter-spacing="0" textLength="165" lengthAdjust="spacing" fill="#6B6B6B">WE TALK. YOU TELL ME WHAT</text>
    <text x="35.8" y="126" font-size="11" letter-spacing="0" textLength="59.4" lengthAdjust="spacing" fill="#6B6B6B">YOU NEED.</text>
    <text x="16" y="153" font-size="11" letter-spacing="0" textLength="59.4" lengthAdjust="spacing" font-weight="700">02 DESIGN</text>
    <text x="35.8" y="168" font-size="11" letter-spacing="0" textLength="165" lengthAdjust="spacing" fill="#6B6B6B">I SKETCH IT. YOU PICK THE</text>
    <text x="35.8" y="181" font-size="11" letter-spacing="0" textLength="33" lengthAdjust="spacing" fill="#6B6B6B">LOOK.</text>
    <text x="16" y="208" font-size="11" letter-spacing="0" textLength="52.8" lengthAdjust="spacing" font-weight="700">03 BUILD</text>
    <text x="35.8" y="223" font-size="11" letter-spacing="0" textLength="171.6" lengthAdjust="spacing" fill="#6B6B6B">CLEAN CODE, FAST PAGES, NO</text>
    <text x="35.8" y="236" font-size="11" letter-spacing="0" textLength="39.6" lengthAdjust="spacing" fill="#6B6B6B">BLOAT.</text>
    <text x="16" y="263" font-size="11" letter-spacing="0" textLength="59.4" lengthAdjust="spacing" font-weight="700">04 LAUNCH</text>
    <text x="35.8" y="278" font-size="11" letter-spacing="0" textLength="151.8" lengthAdjust="spacing" fill="#6B6B6B">IT GOES LIVE. I STAY ON</text>
    <text x="35.8" y="291" font-size="11" letter-spacing="0" textLength="33" lengthAdjust="spacing" fill="#6B6B6B">CALL.</text>
